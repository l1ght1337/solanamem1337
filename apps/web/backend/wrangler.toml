name = "meme-bundler-backend"
main = "src/index.ts"
compatibility_date = "2024-08-15"
node_compat = true

# если используешь Pages → можно как standalone worker (Pages Functions не нужен)
# если хочешь поддомены типа api.cryptolaunchbot.uk — привяжи route ниже

[vars]
RPC_PRIMARY = "https://app.cryptolaunchbot.uk/rpc"         # можно сразу твой QuickNode
RPC_FALLBACK = "https://api.mainnet-beta.solana.com"
PUMP_BASE = "https://pumpportal.fun"                       # базовый PumpPortal
CORS_ORIGINS = "https://app.cryptolaunchbot.uk,https://solanamem1337.pages.dev"

# Durable Object (бот-менеджер)
[[durable_objects.bindings]]
name = "BOT_MANAGER"
class_name = "BotManager"

# Хранилище Durable Object
[[migrations]]
tag = "v1"
new_classes = ["BotManager"]

# Если хочешь привязать воркер к домену (Workers Routes)
# [routes]
# patterns = ["api.cryptolaunchbot.uk/*"]
