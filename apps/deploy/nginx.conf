server {
  listen 443 ssl;
  server_name your.domain;

  root /var/www/app/dist;         # apps/web/dist
  index index.html;

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # Прокси к PumpPortal (если используете /x/pump)
  location /x/pump/ {
    proxy_pass https://pumpportal.fun/;
    proxy_set_header Host pumpportal.fun;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Basic Auth (быстро и просто)
  auth_basic "Restricted";
  auth_basic_user_file /etc/nginx/.htpasswd;
}
